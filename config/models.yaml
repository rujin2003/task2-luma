# Per-role model routing. Swapping providers, or upgrading one role to a stronger model,
# is a change to this file and nothing else.
#
# Verified 2026-09-06 against generativelanguage.googleapis.com/v1beta/models:
#   gemini-3.8-flash        — default specialists (1M context, generateContent)
#   gemini-3.1-pro-preview  — Commander + conflict resolution (2.5-pro closed to new keys)
# See docs/LLM_STRATEGY.md §1. Confirm free-tier retention/training terms before any
# tenant ledger data reaches the API — procurement blocker for a treasury product.
version: 1

defaults:
  provider: gemini
  model: gemini-3.8-flash
  max_output_tokens: 2500
  temperature: 0 # determinism first; this is a financial system
  timeout_s: 45.0
  max_attempts: 2

# LLM_STRATEGY.md section 4. Enforced per role, logged on AgentRun, asserted in CI so a
# prompt change that doubles context fails the build.
#
# The output allowance was 500 and was measured wrong. A complete AgentFinding carries a
# confidence block, evidence with excerpts, risks and recommended actions; against a
# 500-token cap live Gemini truncated mid-string. Reported honestly as a schema
# violation, but a failed agent all the same.
#
# 2500 is measured, not guessed: the six specialists run 175-1777 output tokens against
# the fixture toolset on gemini-3.8-flash, so this is the observed ceiling plus headroom.
# Input budgets are unchanged; this is not a licence for longer prompts.
budgets:
  system_prompt: 800
  context_pack: 600
  findings_digest: 400
  tool_results: 1500
  total_input: 4000
  # Raised from 2500 when the toolset started reading real tenant ledgers: a finding that
  # cites ten actual invoices is longer than one that cites three fixture rows, and a
  # truncation reported honestly is still a failed agent.
  output: 4000

# Bounded concurrency and rate limiting for the parallel wave (section 5). A free tier
# will throttle nine concurrent agents; "queued" is an honest status, not a failure.
executor:
  max_in_flight: 4
  requests_per_minute: 15
  max_retries: 3
  backoff_base_s: 1.0
  backoff_jitter_s: 0.5

roles:
  forecast: {}
  variance: {}

  # The two ranking agents write one evidence line per ranked row, so their output scales
  # with the size of the tenant's book rather than with the prompt. Measured against a
  # loaded 50-invoice tenant, both truncated mid-JSON at 2000 and at 3200, and completed at 4000.
  ar_collections:
    max_output_tokens: 4000
  ap_optimization:
    max_output_tokens: 4000
  supplier_risk: {}
  dodo_revenue: {}
  stress_test: {}
  covenant_explainer: {}
  cartographer: {}

  # The two roles that carry real risk on a small model (section 6). Mitigations 1 and 2 --
  # enumerated investigation plans, decomposed conflict resolution -- come first; this
  # routing is available, and should be measured before it is paid for.
  commander:
    model: gemini-3.1-pro-preview
    max_output_tokens: 2500
    timeout_s: 90.0
  conflict_resolution:
    model: gemini-3.1-pro-preview
    timeout_s: 90.0

name: ci

on:
  push:
    branches: [dev, main, "p1/**", "p2/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: make lint
      - name: Typecheck finance
        run: make typecheck
      - name: Ban float in finance
        run: make check-float
      - name: Test
        run: make test

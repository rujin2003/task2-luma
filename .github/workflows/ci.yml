name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy

      - name: Tests
        run: pytest -q

      # Phase 0 rule: no float anywhere in the financial path. Money is integer minor
      # units, and a float that slips in here is a rounding bug nobody will find later.
      - name: No float in the financial path
        run: |
          if [ -d backend/finance ]; then
            if grep -rnE '\bfloat\b' backend/finance; then
              echo "float found in the financial path -- use Money / Decimal"
              exit 1
            fi
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Format
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

      - name: Build
        run: npm run build
